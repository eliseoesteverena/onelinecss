<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneLineCSS</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #10b981;
            --accent-hover: #059669;
            --code-bg: #1e293b;
            --code-text: #e2e8f0;
            --surface: #ffffff;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Contenedor principal que empuja el footer hacia abajo */
        main {
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px 100px 20px; /* Padding inferior grande para que el botón sticky no tape el texto */
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p.description {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Estado inicial / Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: var(--surface);
            border: 2px dashed var(--border);
            border-radius: 12px;
            color: var(--text-muted);
            transition: opacity 0.3s ease;
        }

        /* Contenedor del resultado (oculto por defecto) */
        .result-wrapper {
            display: none;
            background: var(--code-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.4s ease-out forwards;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-title {
            color: #94a3b8;
            font-size: 0.85rem;
            font-family: monospace;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        pre {
            padding: 16px;
            margin: 0;
            overflow-x: auto;
            color: var(--code-text);
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        /* ZONA DEL CTA PERSISTENTE */
        .sticky-cta-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(transparent, var(--bg-color) 30%);
            display: flex;
            justify-content: center;
            pointer-events: none; /* Permite clickear el fondo si es necesario */
            z-index: 100;
        }

        .btn-paste {
            pointer-events: auto; /* Reactiva clicks para el botón */
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 99px; /* Botón tipo píldora */
            padding: 18px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            width: 100%;
            max-width: 400px;
            justify-content: center;
        }

        .btn-paste:active {
            transform: scale(0.96);
        }

        .btn-paste:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.5);
        }

        .btn-paste svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            main { padding: 30px 15px 120px 15px; }
            .btn-paste { padding: 16px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>

            <p class="description">Procesa y estandariza tu CSS. Limpia saltos de línea y unifica reglas asegurando un formato determinista de una línea por regla.</p>
        </header>

        <div id="empty-state" class="empty-state">
            <p>El código procesado aparecerá aquí.</p>
        </div>

        <div id="result-wrapper" class="result-wrapper">
            <div class="result-header">
                <span class="result-title">output.css</span>
                <button id="copy-btn" class="btn-copy">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <span id="copy-text">Copiar</span>
                </button>
            </div>
            <pre id="result"></pre>
        </div>
    </main>

    <!-- CTA Persistente -->
    <div class="sticky-cta-container">
        <button id="paste-btn" class="btn-paste">
            <svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
            Pegar y Procesar
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pasteBtn = document.getElementById('paste-btn');
            const copyBtn = document.getElementById('copy-btn');
            const copyText = document.getElementById('copy-text');
            const resultWrapper = document.getElementById('result-wrapper');
            const resultElement = document.getElementById('result');
            const emptyState = document.getElementById('empty-state');
            
            pasteBtn.addEventListener('click', async function() {
                try {
                    const cssText = await navigator.clipboard.readText();
                    if (cssText) {
                        renderResult(cssText);
                    }
                } catch (err) {
                    // Fallback visual silencioso en caso de bloqueo de permisos
                    const cssText = prompt('Permiso denegado al portapapeles.\n\nPor favor, pega tu código CSS aquí:');
                    if (cssText) {
                        renderResult(cssText);
                    }
                }
            });
            
            copyBtn.addEventListener('click', async function() {
                try {
                    const processedCss = resultElement.textContent;
                    await navigator.clipboard.writeText(processedCss);
                    
                    // Feedback visual en el botón
                    const originalText = copyText.textContent;
                    copyText.textContent = '¡Copiado!';
                    copyBtn.style.background = 'rgba(16, 185, 129, 0.3)'; // Tinte verde
                    
                    setTimeout(() => {
                        copyText.textContent = originalText;
                        copyBtn.style.background = '';
                    }, 2000);
                } catch (err) {
                    alert('No se pudo copiar al portapapeles. Selecciona el texto manualmente.');
                }
            });

            function renderResult(rawCss) {
                const processedCss = processCss(rawCss);
                resultElement.textContent = processedCss;
                
                // Cambiar estados UI
                emptyState.style.display = 'none';
                resultWrapper.style.display = 'block';
                
                // Animación de scroll suave hacia el inicio del código
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
            
            // Función determinista para procesar el CSS
            function processCss(cssText) {
                let processed = cssText.replace(/\s+/g, ' ').trim();
                
                processed = processed
                    .replace(/\s*{\s*/g, ' { ')
                    .replace(/\s*}\s*/g, ' } ')
                    .replace(/\s*;\s*/g, '; ');
                
                processed = processed.replace(/}\s*/g, '}\n');
                processed = processed.replace(/ {2,}/g, ' ').trim();
                
                return processed;
            }
        });
    </script>
